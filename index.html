<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="REALITROS: menú dinámico tipo delivery, pedidos por WhatsApp y app instalable PWA.">
  <meta name="theme-color" content="#0f1115">
  <title>REALITROS | Menú dinámico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-nav">
    <a class="brand" href="#">REALITROS</a>
    <button id="installBtn" class="btn outline" type="button" hidden>Descargar app</button>
  </header>

  <main class="layout">
    <section class="content">
      <div class="hero">
        <p class="eyebrow">ENTREGA • PICKUP • FIESTA</p>
        <h1>Tu menú REALITROS <span>tipo delivery</span></h1>
        <p>Explora por categorías, agrega al carrito y pide en segundos como en apps tipo Uber Eats.</p>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Buscar litros, snacks o combos..." aria-label="Buscar productos">
        <div id="categoryChips" class="chips" aria-label="Categorías"></div>
      </div>

      <section id="productGrid" class="product-grid" aria-live="polite"></section>
    </section>

    <aside class="cart" aria-labelledby="cartTitle">
      <h2 id="cartTitle">Tu pedido</h2>
      <div id="cartItems" class="cart-items"></div>
      <div class="cart-summary">
        <p><span>Subtotal</span><strong id="subtotal">$0</strong></p>
        <p><span>Envío</span><strong id="delivery">$25</strong></p>
        <p class="total"><span>Total</span><strong id="total">$25</strong></p>
      </div>
      <button id="checkoutBtn" class="btn primary full" type="button">Pedir por WhatsApp</button>
    </aside>
  </main>

  <template id="productTemplate">
    <article class="product-card">
      <figure class="product-illustration" aria-hidden="true">
        <span class="product-icon"></span>
      </figure>
      <p class="badge"></p>
      <h3 class="title"></h3>
      <p class="desc"></p>
      <div class="meta">
        <strong class="price"></strong>
        <button class="btn small primary" type="button">Agregar</button>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
